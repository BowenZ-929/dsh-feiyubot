name: astrbot_plugin_qqagent
display_name: 七器官与家
short_desc: 七器官合体的她：魂、心、脑、嘴、手、眼、耳与家，十个器官包全部有代码
desc: |
  她是七器官加一个家，这套插件就是她的落地形态：眼、耳把世界收进来，魂、心、脑在里面过一遍，
  嘴、手把结果做到外面去，痕迹落进家。一个器官对应 organs/ 下的一个子包。
  organs/ 下十个包全部有代码：魂（人写只读的七件正文，带原子写、唯一写路径、变更史与醒时自检）、
  心（情绪与精力，读时现算）、脑（唯一写入路径的记忆与字面召回）、嘴（切分与节奏）、
  手（六个具名动作 + 三层许可 + 只增手账）、眼（看图）、耳（本地转写）、家（十间房与仓库）、
  mind（装配一轮并调模型）、day（节律与自主）。
  框架无关的 HTTP 层聚成一张路由表（约 130 条），本地开发服务器只绑 127.0.0.1，没有鉴权。
  本插件是**过渡壳**：先跑来喂通道，不是绑定目标。目标壳是 DeepSeek Harness（基座 fork
  NimuStudio/NimuQDock-dsh，通道 NapCat OneBot v11）。核在 organs/ 与 api/ 下，不含任何宿主 import；
  壳可换、核只有一份，不许复制。
version: 0.1.0
author: "bowen"
astrbot_version: ">=4.24.2"  # 过渡壳的运行下限，不是目标绑定
support_platforms:
  - aiocqhttp
tags:
  - 魂
  - 七器官
  - WebUI
