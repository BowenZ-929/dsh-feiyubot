<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>表情图库 · 她的面板</title>
<style>
:root{color-scheme:light dark;--bg:var(--dsw-alias-bg-l1,Canvas);--fg:var(--dsw-alias-text-l1,CanvasText);--dim:var(--dsw-alias-text-l2,GrayText);--line:rgba(128,128,128,.25);--brand:var(--dsw-alias-brand,#4d6bfe)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:28px 22px}h1{font-size:26px;margin:0}h2{font-size:19px}p{margin:8px 0 18px}.dim,small{color:var(--dim)}a{color:var(--brand)}button,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--brand);color:#fff}input[type=checkbox]{width:auto}textarea{width:100%;min-height:95px;resize:vertical}label{display:block;margin:12px 0}label input[type=text]{width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 12px}.toolbar input{flex:1;min-width:160px}#notice{min-height:26px;color:var(--dim)}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}.card img{width:100%;height:150px;object-fit:contain}.card p{font-size:13px;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card button{margin-top:auto}.pager{display:flex;justify-content:space-between;margin:18px 0}#editor{border:1px solid var(--line);border-radius:14px;padding:22px;margin:26px 0}#original{display:block;max-width:100%;max-height:380px;margin:12px auto;object-fit:contain}details{margin:16px 0}summary{cursor:pointer}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}.history-row{border-top:1px solid var(--line);padding:12px 0}[hidden]{display:none!important}@media(max-width:480px){main{padding:20px 14px}#gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:10px}.card img{height:120px}#editor{padding:16px}}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
</style></head><body><main>
<h1>表情图库</h1><p class="dim">看清每张图表达什么，再决定什么时候用。旧描述保留来源，可逐张修正。</p>
<p class="dim">旧图未重新调用看图模型；去掉分类前缀不代表描述已经准确。开启聊天选图后，她会结合整段话和回复选择一张或不发，有候选时会额外调用一次模型。</p>
<label><input id="chat-enabled" type="checkbox" disabled> 私聊和群聊按语境选表情</label><p class="dim">两种聊天共用此开关。由她判断是否合适；选中后，表情在文字后单独发送。</p><p id="chat-status" class="dim" role="status"></p>
<form id="search-form" class="toolbar"><input id="search" type="search" maxlength="200" placeholder="搜图中文字、动作或关键词" aria-label="搜索表情"><button type="submit">搜索</button><button id="refresh" type="button">刷新</button></form>
<div id="notice" role="status" aria-live="polite"></div><div id="gallery"></div>
<div class="pager"><button id="previous" disabled>上一页</button><span id="page" class="dim"></span><button id="next" disabled>下一页</button></div>
<section id="editor" hidden><h2>查看与修正</h2><p id="selection-status" class="dim"></p><img id="original" alt="所选表情原图">
<form id="edit-form"><label>画面和含义<textarea id="description" maxlength="2000" required></textarea></label><label>图片上可见的文字<textarea id="visible-text" maxlength="2000"></textarea></label><label>关键词（用逗号分隔）<input id="keywords" type="text"></label><label><input id="enabled" type="checkbox"> 保留为可用候选</label><label><input id="reviewed" type="checkbox"> 我已对照图片核对这些描述</label><button id="save" class="primary" type="submit">保存修改</button></form>
<p id="save-status" role="status" aria-live="polite"></p><details><summary>旧描述与来源</summary><pre id="source"></pre></details><details><summary>修改记录</summary><div id="history"></div></details></section>
</main><script src="panel-base.js" data-page="memes"></script><script>
(function(){'use strict';
const $=id=>document.getElementById(id);let offset=0,selected=null,busy=false;
function n(tag,text){const node=document.createElement(tag);if(text!=null)node.textContent=text;return node;}
async function call(method,path,body){const res=await panelFetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw new Error(data.message||'请求失败');return data;}
async function load(){if(busy)return;busy=true;$('notice').textContent='读取中…';$('previous').disabled=true;$('next').disabled=true;$('refresh').disabled=true;
try{const query=new URLSearchParams({q:$('search').value.trim(),offset:String(offset),limit:'20'});const page=await call("GET","/memes/list?"+query);$('gallery').replaceChildren();
$('chat-enabled').checked=page.chat_enabled;$('chat-enabled').disabled=false;$('chat-status').textContent=page.chat_enabled?'已开启：没有合适图就不发；近四轮已发的同图不重复。':'已关闭：可整理图库，聊天不会自动配表情。';
for(const row of page.items){const card=n('article');card.className='card';const img=n('img');img.src=row.preview;img.alt='表情缩略图';const button=n('button','查看与编辑');button.onclick=()=>read(row.id);card.append(img,n('small',(row.enabled?'可用候选':'已停用')+' · '+(row.reviewed?'已人工核对':'旧描述待核对')),n('p',row.description||'暂无描述'),button);$('gallery').append(card);}
$('notice').textContent=page.total+' 张表情 · 当前 '+(page.items.length?offset+1:0)+'–'+Math.min(offset+20,page.total)+' 张';$('page').textContent=page.total?'第 '+(Math.floor(offset/20)+1)+' / '+Math.ceil(page.total/20)+' 页':'';$('previous').disabled=offset===0;$('next').disabled=!page.has_older;
if(!page.items.length)$('gallery').append(n('p','没有匹配的表情，可以换几个关键词。'));
}catch(error){$('gallery').replaceChildren();$('page').textContent='';$('notice').textContent='读取失败：'+error.message;}finally{busy=false;$('refresh').disabled=false;}}
async function read(id){if(busy)return;busy=true;$('save').disabled=true;$('save-status').textContent='';
try{const row=await call("GET","/memes/read?id="+encodeURIComponent(id));selected=row;$('editor').hidden=false;$('original').src=row.image;$('description').value=row.description;$('visible-text').value=row.visible_text;$('keywords').value=row.keywords.join('，');$('enabled').checked=row.enabled;$('reviewed').checked=row.reviewed;$('selection-status').textContent=(row.reviewed?'已人工核对':'旧模型描述，仍待核对')+' · 第 '+row.revision+' 版';$('source').textContent=row.source.description+'\n\n旧文件：'+row.source.path;$('history').replaceChildren();
const labels={description:'描述',visible_text:'图片文字',keywords:'关键词',enabled:'候选开关',reviewed:'人工核对'};const show=v=>typeof v==='boolean'?(v?'是':'否'):Array.isArray(v)?v.join('，'):v;
for(const change of row.changes){const box=n('div');box.className='history-row';box.append(n('small',new Date(change.at).toLocaleString()));for(const [key,label] of Object.entries(labels)){if(JSON.stringify(change.before[key])!==JSON.stringify(change.after[key]))box.append(n('pre',label+'：'+show(change.before[key])+' → '+show(change.after[key])))}$('history').append(box)}
if(!row.changes.length)$('history').append(n('p','尚无人工修改。'));$('editor').scrollIntoView({behavior:'smooth',block:'start'});
}catch(error){$('save-status').textContent=error.message;$('notice').textContent='详情读取失败：'+error.message;}finally{busy=false;$('save').disabled=!selected;}}
$('edit-form').onsubmit=async event=>{event.preventDefault();if(busy||!selected)return;busy=true;$('save').disabled=true;try{const id=selected.id;await call("POST","/memes/save",{id,revision:selected.revision,description:$('description').value,visible_text:$('visible-text').value,keywords:$('keywords').value.split(/[,，]/).map(v=>v.trim()).filter(Boolean),enabled:$('enabled').checked,reviewed:$('reviewed').checked});busy=false;await load();await read(id);$('save-status').textContent='已保存，旧描述与原图保持不变。';}catch(error){$('save-status').textContent='保存失败：'+error.message;}finally{busy=false;$('save').disabled=false;}};
$('chat-enabled').onchange=async()=>{const value=$('chat-enabled').checked;$('chat-enabled').disabled=true;try{await call("POST","/memes/settings",{chat_enabled:value});$('chat-status').textContent=value?'已开启：没有合适图就不发；近四轮已发的同图不重复。':'已关闭：聊天不会自动配表情。';}catch(error){$('chat-enabled').checked=!value;$('chat-status').textContent='设置失败：'+error.message;}finally{$('chat-enabled').disabled=false;}};
$('search-form').onsubmit=event=>{event.preventDefault();offset=0;load();};$('refresh').onclick=load;$('next').onclick=()=>{offset+=20;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-20);load();};load();
})();
</script></body></html>
