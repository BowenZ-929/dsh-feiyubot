<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>她的面板</title>
<script src="panel-base.js" data-page="panel"></script>
<style>
  /* 颜色只取宿主变量，兜底用系统色；深色跟随宿主 [data-theme="dark"]。 */
  :root {
    color-scheme: light dark;
    --gap-1: 12px;
    --gap-2: 20px;
    --bg: var(--dsw-alias-bg-l1, Canvas);
    --panel: var(--dsw-alias-bg-l2, Canvas);
    --line: var(--dsw-alias-border-l2, rgba(128, 128, 128, .4));
    --fg: var(--dsw-alias-text-l1, CanvasText);
    --dim: var(--dsw-alias-text-l2, GrayText);
    --brand: var(--dsw-alias-brand, #4d6bfe);
    --on-brand: var(--dsw-alias-text-on-brand, #fff);
  }
  html[data-theme="dark"] { color-scheme: dark; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: .95rem/1.6 -apple-system, "PingFang SC", "Heiti SC", sans-serif;
         display: flex; flex-direction: column;
         min-height: 100vh; }
  nav { display: flex; flex-wrap: wrap; gap: var(--gap-1); align-items: center;
        padding: var(--gap-1) var(--gap-2); background: var(--panel);
        border-bottom: 1px solid var(--line); }
  nav a { padding: var(--gap-1); border-radius: 999px; text-decoration: none;
          color: var(--dim); }
  nav a:hover { color: var(--fg); }
  nav a.on { background: var(--brand); color: var(--on-brand); }
  iframe { flex: 1; border: 0; width: 100%; display: block; background: var(--bg); }
html[data-theme="light"]{color-scheme:light}
</style>
</head>
<body>
<!-- 导航只是搬运：每一项都是**相对地址**，解析出来就是核上那一页。
     直开核时文档在 /panel，相对 about 解析成 /about；
     壳里文档在 /qqagent/panel/panel，相对 about 解析成 /qqagent/panel/about，剥前缀后还是 /about。
     主导航对应真实页面，观察入口也保留；子页实际加载后同步选中状态与地址。
     点不出 404 是这一页的硬要求，删一个按钮比留一个死按钮强。
     心与家两条只读面不占导航位，入口在「设置」里。 -->
<nav id="tabs" aria-label="她的面板导航">
  <a href="./" target="organ" class="on">魂</a>
  <a href="about" target="organ">关于他</a>
  <a href="memory" target="organ">记忆</a>
  <a href="chat" target="organ">聊天</a>
  <a href="observe" target="organ">观察</a>
  <a href="day" target="organ">今天</a>
  <a href="settings" target="organ">设置</a>
</nav>
<iframe name="organ" title="面板页" src="./"></iframe>
<script>
(function () {
  "use strict";

  var tabs = document.getElementById("tabs");
  var links = Array.from(tabs.querySelectorAll("a"));
  var frame = document.querySelector('iframe[name="organ"]');
  var base = window.PANEL_BASE;
  // 子页归属；主页面直接从现有导航读取，不另建菜单。
  var sections = {"/galaxy": "memory", "/heart": "settings", "/home": "settings",
    "/phone": "settings", "/expressions": "settings", "/memes": "settings",
    "/learning": "settings", "/studio": "settings", "/eye": "settings",
    "/voice": "settings", "/ear": "settings"};
  links.forEach(function (link) {
    sections[new URL(link.href).pathname.slice(base.length)] = link.getAttribute("href");
  });
  function pageOf(url) {
    if (url.origin !== location.origin || !url.pathname.startsWith(base + "/")) { return null; }
    var path = url.pathname.slice(base.length);
    return sections[path] ? path : null;
  }
  function remember() {
    var doc = frame.contentDocument;
    if (!doc) { return; }
    var url = new URL(doc.URL), page = pageOf(url);
    if (!page) { return; }
    links.forEach(function (link) {
      var selected = link.getAttribute("href") === sections[page];
      link.className = selected ? "on" : "";
      if (selected) { link.setAttribute("aria-current", "page"); }
      else { link.removeAttribute("aria-current"); }
    });
    frame.title = doc.title || "面板页";
    history.replaceState(null, "", "#" + page + url.search + url.hash);
  }
  function restore() {
    var route = location.hash.slice(1);
    if (!route) { return; }
    var url = route.startsWith("/") && !route.startsWith("//") && !route.includes("\\")
      ? new URL(base + route, location.origin) : null;
    if (!url || !pageOf(url)) { return; }
    if (!frame.contentDocument || frame.contentDocument.URL !== url.href) {
      frame.contentWindow.location.replace(url.href);
    }
  }
  frame.addEventListener("load", function () {
    remember();
    if (frame.contentDocument) {
      frame.contentWindow.addEventListener("hashchange", remember);
      frame.contentWindow.addEventListener("panel-routechange", remember);
    }
  });
  window.addEventListener("hashchange", restore);
  restore();
}());
</script>
</body>
</html>
