<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>看图 · 她的面板</title>
<style>
:root{color-scheme:light dark;--bg:var(--dsw-alias-bg-l1,Canvas);--fg:var(--dsw-alias-text-l1,CanvasText);--line:var(--dsw-alias-border-l2,#8884);--brand:var(--dsw-alias-brand,#5475d6)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,"PingFang SC",sans-serif}main{max-width:880px;margin:auto;padding:32px 24px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0}.muted{opacity:.65}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.card,article{border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}button{font:inherit;padding:8px 16px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);cursor:pointer}button.primary{background:var(--brand);color:white}button:disabled{opacity:.4;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:8px 0}summary{cursor:pointer;color:var(--brand)}dl{display:grid;grid-template-columns:5em 1fr;gap:8px 14px}dt{opacity:.65}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#c44}#state{font-weight:600}.pager{display:flex;gap:10px}a{color:var(--brand)}@media(max-width:600px){main{padding:22px 14px}.card,article{padding:16px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:8px}}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
</style></head><body><main>
<h1>她看见了什么</h1><p class="muted">图片里的内容、语气，以及没看清的部分。观察不会自动成为她的亲历。</p>
<section class="card"><div class="toolbar"><span id="state">读取状态中…</span><button id="toggle" class="primary" disabled>看图开关</button><button id="refresh">刷新</button></div>
<p id="config" class="muted"></p>
<details><summary>当前参数</summary><pre id="parameters">本次尚未取得参数。</pre><p class="muted">读取当前生效配置；刷新不会调用模型。变化记录只显示已有历史，不根据当前值推测过去的设置。</p><p><a href="day?source=eye#activity-card">查看这项能力的事件与参数变化</a></p></details>
<p class="muted">开启后，QQ 图片会发送到硅基流动并产生用量费用。只处理本轮附件；原图不保存在这里。动图采用抽帧观察，无法覆盖全部动作。语音请看<a href="ear">听语音记录</a>。</p></section>
<div id="status" role="status" aria-live="polite"></div><section id="records" aria-label="图片观察记录"></section>
<div class="pager"><button id="newer" disabled>较新记录</button><button id="older" disabled>较早记录</button></div>
<p><a href="settings">返回设置</a> · <a href="observe">查看对话和发送记录</a></p>
</main><script src="panel-base.js" data-page="eye"></script><script>
(()=>{"use strict";
const $=id=>document.getElementById(id);let enabled=false,offset=0;
const names={ok:"已识别",sensitive:"敏感图，未转述",failed:"识别失败",unavailable:"未识别",skipped:"本轮未处理"};
const reasons={disabled:"看图已关闭",missing_key:"尚未配置凭据",round_budget:"达到本轮处理上限",ValueError:"图片地址、格式或识别结果不符合要求",TimeoutError:"识别超时",URLError:"无法连接图片或视觉服务"};
function detail(parent,title,data){const d=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("pre");s.textContent=title;p.textContent=JSON.stringify(data,null,2);d.append(s,p);parent.append(d);}
const parameterNames={"enabled":"看图开关","model":"视觉模型","base_url":"服务地址","max_images":"每轮最多图片数","budget_seconds":"整轮观察预算（秒）","max_bytes":"单图下载上限（字节）","max_tokens":"模型输出 token 上限"};
async function load(){
 $("parameters").textContent="本次尚未取得参数。";
 $("refresh").disabled=true;$("toggle").disabled=true;$("status").textContent="正在读取…";
 try{
  const sr=await panelFetch("/eye/status"),state=await sr.json();if(!sr.ok||!state.ok)throw new Error(state.message||"状态读取失败");
  $("parameters").textContent=Object.entries(state.config).map(([key,value])=>(parameterNames[key]||key)+"："+(typeof value==="boolean"?(value?"开启":"关闭"):value)).join("\n");
  enabled=state.config.enabled;$("state").textContent=enabled?"看图已开启":"看图已关闭";$("toggle").textContent=enabled?"关闭看图":"开启看图";
  $("config").textContent=`${state.config.model} · ${state.credential_ready?"凭据已配置":"尚未配置凭据"} · 每轮最多 ${state.config.max_images} 张 · 观察预算 ${state.config.budget_seconds} 秒`;
  const rr=await panelFetch("/observe/records?source=eye&limit=20&offset="+offset),page=await rr.json();if(!rr.ok||!page.ok)throw new Error(page.message||"记录读取失败");
  const root=$("records");root.replaceChildren();$("status").className="muted";$("status").textContent=page.total?`共 ${page.total} 条记录 · 当前显示 ${page.rows.length} 条`:"还没有看图记录。开启后可在 QQ 发图，下一轮刷新查看。";
  for(const item of page.rows){const r=item.record,card=document.createElement("article"),h=document.createElement("h2"),p=document.createElement("p");
   h.textContent=r.kind==="setting"?`看图开关：${r.before?"开":"关"} → ${r.after?"开":"关"}`:`${names[r.status]||r.status} · ${r.speaker||"发图者未记录"}`;
   p.className="muted";p.textContent=`${r.at||""}${r.session_id?" · "+r.session_id:""}${r.message_id!=null?" · 消息 "+r.message_id:""}`;card.append(h,p);
   if(r.observation&&!r.observation.sensitive){const dl=document.createElement("dl");for(const [k,label] of [["subject","画面"],["scene","场景"],["visible_text","图中文字"],["meaning","可能含义"],["uncertainty","不确定"]]){const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=label;dd.textContent=r.observation[k]||"无";dl.append(dt,dd);}card.append(dl);}
   if(r.reason){const reason=document.createElement("p");reason.textContent=reasons[r.reason]||r.reason;card.append(reason);}
   detail(card,"来源、抽帧与用量",r);root.append(card);
  }
  $("newer").disabled=offset===0;$("older").disabled=!page.has_older;
 }catch(e){$("status").className="error";$("status").textContent=e.message;}
 finally{$("refresh").disabled=false;$("toggle").disabled=false;}
}
$("toggle").onclick=async()=>{$("toggle").disabled=true;try{const r=await panelFetch("/eye/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!enabled})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.message||"开关保存失败");offset=0;await load();}catch(e){$("status").textContent=e.message;$("toggle").disabled=false;}};
$("refresh").onclick=()=>{offset=0;load();};$("newer").onclick=()=>{offset=Math.max(0,offset-20);load();};$("older").onclick=()=>{offset+=20;load();};load();
})();
</script></body></html>
