<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 还没接</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.65 -apple-system, "PingFang SC", "Heiti SC", sans-serif;
         margin: 0; padding: 2.2rem 1.2rem 3rem; color: #1b1b1b; background: #fbfbfb; }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; letter-spacing: .02em; }
  .note { margin: 0 0 1.2rem; color: #7a5c00; background: #fffbea;
          border-left: 3px solid #e0c265; padding: .45rem .6rem; font-size: .9rem; }
  .back { font-size: .9rem; margin-top: 2.4rem; }
</style>
</head>
<body>
<main>
  <h1>设置 · 还没接</h1>
  <p class="note">还没接：这一页只有地址，没有内容。</p>
  <p>为什么：设置要改的是三处的真参数（魂的待人姿态与红线、心的轴档、脑的改基线），
     而写入口现在只有一个——魂页那张表单（账本上记作 panel）。把设置页先做成一张表，
     就得为「谁能改哪一处」重新裁一遍判据；这件事没裁之前，控件一个都不放。</p>
  <p>所以这一轮只把 <code>/settings</code> 这个地址占住，导航里点得到、打开是这一页，不是 404。</p>
  <p class="back"><a href="../">← 回魂面板</a></p>
</main>
</body>
</html>
