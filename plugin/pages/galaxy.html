<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆星图 · 她的面板</title>
<script src="panel-base.js" data-page="galaxy"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--dsw-alias-bg-l1, Canvas);
  --panel: var(--dsw-alias-bg-l2, Canvas);
  --fg: var(--dsw-alias-text-l1, CanvasText);
  --dim: var(--dsw-alias-text-l2, GrayText);
  --line: var(--dsw-alias-border-l2, rgba(128,128,128,.3));
  --brand: var(--dsw-alias-brand, #4d6bfe);
  font: 15px/1.6 -apple-system,"PingFang SC",sans-serif;
  background: var(--bg); color: var(--fg);
}
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; }
button,input,select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; }
button { cursor: pointer; }
button:hover,button:focus-visible { border-color: var(--brand); }
a { color: var(--brand); }
header { padding: 22px 28px 14px; display: flex; gap: 20px; align-items: center; justify-content: space-between; }
h1 { font-size: 23px; font-weight: 500; margin: 0; letter-spacing: .08em; }
h2 { font-size: 18px; margin: 0 0 14px; }
p { margin: 8px 0; }
.dim,small { color: var(--dim); }
.tools { display: flex; flex-wrap: wrap; gap: 9px; padding: 0 28px 15px; align-items: center; }
.tools input { flex: 1; min-width: 180px; }
.layout { display: grid; grid-template-columns: minmax(0,1fr) 330px; min-height: 68vh; border-top: 1px solid var(--line); }
/* 只有绘图区保留夜空色，星体和关系线的颜色由 galaxy.js 定义。 */
.space { color-scheme: dark; color: #dce7f6; position: relative; min-height: 540px; overflow: hidden; background: radial-gradient(ellipse at center,#17243d 0%,#080e1b 68%); }
canvas { width: 100%; height: 100%; position: absolute; inset: 0; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.overlay { position: absolute; left: 24px; right: 24px; bottom: 20px; pointer-events: none; color: #a8bad3; font-size: 13px; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
[hidden] { display: none!important; }
aside { padding: 24px; background: var(--panel); border-left: 1px solid var(--line); overflow-wrap: anywhere; max-height: 75vh; overflow: auto; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; background: var(--bg); border: 1px solid var(--line); padding: 14px; border-radius: 9px; margin: 10px 0; }
dl { display: grid; grid-template-columns: 85px minmax(0,1fr); gap: 6px; margin: 14px 0; }
dt { color: var(--dim); }
dd { margin: 0; }
.neighbors button { display: block; width: 100%; text-align: left; margin: 7px 0; }
.list { padding: 20px 28px; }
.rows { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 8px; }
.rows button { width: 100%; height: 100%; text-align: left; }
.rows small { display: block; }
.legend { display: flex; gap: 16px; }
.person { color: #8fc7ff; } .event { color: #f1c28c; } .topic { color: #c7afff; }
#status { padding: 0 28px 14px; font-size: 13px; color: var(--dim); }
#status[data-error=true] { color: var(--dsw-alias-danger, #c35d39); }
.view-selected { outline: 2px solid var(--brand); }
footer { padding: 18px 28px; color: var(--dim); font-size: 12px; }
button:disabled { opacity: .45; cursor: default; }
@media(max-width:800px){.layout{grid-template-columns:1fr}.space{min-height:420px}aside{max-height:none;border-left:0;border-top:1px solid var(--line)}header{align-items:flex-start;padding:18px}.tools,.list{padding-left:18px;padding-right:18px}h1{font-size:20px}}
</style>
</head>
<body>
<header><div><h1>记忆星图</h1><p class="dim">那些人、那些话，和它们留下的联系。</p></div><a href="memory">返回记忆</a></header>
<div class="tools">
<input id="search" type="search" aria-label="搜索真实记忆、人物或话题" placeholder="找一个人、一句话、一个话题…">
<select id="kind" aria-label="节点类型"><option value="">全部类型</option><option value="person">人物</option><option value="event">记忆</option><option value="topic">话题</option></select>
<select id="state" aria-label="记忆状态"><option value="active">在役记忆</option><option value="all">含退役与冷库</option></select>
<button id="reset" type="button">复位视角</button><button id="toggle-list" type="button" aria-pressed="false">列表视图</button>
</div>
<p id="status" role="status" aria-live="polite">正在读取真实记忆…</p>
<main>
<div class="layout"><section class="space" id="space" aria-label="记忆星图画布">
<canvas id="canvas" aria-label="拖动旋转、滚轮缩放；节点也可在下方列表选择"></canvas>
<div id="empty" class="empty"><p>等待记忆数据</p></div>
<div class="overlay"><p class="legend"><span class="person">● 人物</span><span class="event">● 记忆</span><span class="topic">◆ 话题</span></p>拖动旋转 · 滚轮缩放 · 点选查看关联<br>连线来自已存关系或记忆中记录的交流对象；位置与连线不代表因果。</div>
</section><aside id="detail" aria-live="polite"><h2>先选一颗星</h2><p class="dim">可以点选画布，也可以从列表进入。这里会展示原文、来源和已有的关联。</p></aside></div>
<section class="list"><h2 id="list-heading">记忆索引</h2><p class="dim" id="list-count"></p><ul id="rows" class="rows"></ul><button id="more" type="button" hidden>再显示 50 条</button></section>
</main>
<footer>只读展示，不增加召回次数，不修改记忆。银河布局与投影适配自 dsh-Memory-Galaxy（MIT）；记忆和关联来自本项目脑库。</footer>
<script src="galaxy.js"></script>
</body></html>
